name: 말씀 암송 APK 만들기
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html 확인
        run: test -f index.html || (echo "index.html 파일이 저장소에 없습니다. 먼저 올려 주세요." && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 프로젝트 준비
        run: |
          mkdir -p www && cp index.html www/index.html
          sed -i "s/__BUILD__/#${GITHUB_RUN_NUMBER} $(TZ=Asia/Seoul date +%m.%d_%H:%M)/" www/index.html
          cat > package.json <<'J'
          {"name":"malsseum-amsong","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^7.0.0","@capacitor/app":"^7.0.0","@capacitor/core":"^7.0.0","@capacitor/local-notifications":"^7.0.0","@capacitor-community/text-to-speech":"^6.0.0"},
           "devDependencies":{"@capacitor/cli":"^7.0.0"}}
          J
          cat > capacitor.config.json <<'J'
          {"appId":"kr.malsseum.amsong","appName":"말씀 암송","webDir":"www"}
          J
          npm install || (echo "::warning::읽어 주기(TTS) 부품을 받지 못해 빼고 진행합니다" && node -e 'const f="package.json";const p=JSON.parse(require("fs").readFileSync(f));delete p.dependencies["@capacitor-community/text-to-speech"];require("fs").writeFileSync(f,JSON.stringify(p))' && npm install)
          npx cap add android
      - name: 권한 설정
        run: |
          node -e '
          const fs=require("fs");const p="android/app/src/main/AndroidManifest.xml";let x=fs.readFileSync(p,"utf8");
          for(const n of ["POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM","RECEIVE_BOOT_COMPLETED","WAKE_LOCK"]){const f="android.permission."+n;if(!x.includes(f))x=x.replace("</manifest>","    <uses-permission android:name=\""+f+"\" />\n</manifest>")}
          if(!x.includes("android.intent.action.TTS_SERVICE"))x=x.replace("</manifest>","    <queries><intent><action android:name=\"android.intent.action.TTS_SERVICE\" /></intent></queries>\n</manifest>");
          fs.writeFileSync(p,x);console.log("권한 추가 완료")'
          npx cap sync android
      - name: 앱 아이콘 (펼친 성경과 책갈피)
        run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/mipmap-anydpi-v26 $R/values
          cat > $R/drawable/ic_amsong_fg.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFDF8" android:pathData="M30,38 Q42,34 53,39 L53,74 Q42,69 30,73 Z"/>
            <path android:fillColor="#F1E7D3" android:pathData="M55,39 Q66,34 78,38 L78,73 Q66,69 55,74 Z"/>
            <path android:fillColor="#C8963E" android:pathData="M68,36 h5 v20 l-2.5,-3 -2.5,3 z"/>
            <path android:fillColor="#27407A" android:pathData="M35,47 h13 v1.6 h-13 z M35,52 h13 v1.6 h-13 z M35,57 h10 v1.6 h-10 z"/>
          </vector>
          XML
          for f in ic_launcher ic_launcher_round; do cat > $R/mipmap-anydpi-v26/$f.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/am_bg"/>
            <foreground android:drawable="@drawable/ic_amsong_fg"/>
          </adaptive-icon>
          XML
          done
          cat > $R/values/am_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="am_bg">#27407A</color></resources>
          XML
          echo "아이콘 적용 완료"
      - name: 홈 화면 암송 위젯 추가
        run: |
          cat > add-amw.js <<'AWJ'
          // 홈 화면 암송 위젯: 앱이 오늘의 구절 목록을 넘기면 위젯에서 장절만 → 첫 글자 → 전체로 바꿔 가며 외웁니다
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));const pkg=cfg.appId;
          const javaDir=path.join('android/app/src/main/java',...pkg.split('.'));const res='android/app/src/main/res';
          ['layout','xml','drawable'].forEach(d=>fs.mkdirSync(path.join(res,d),{recursive:true}));
          const W=(f,s)=>fs.writeFileSync(path.join(javaDir,f),s.replace(/__PKG__/g,pkg));
          W('AmWidget.java',`package __PKG__;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // 홈 화면 암송 위젯: 장절만 → 첫 글자 → 전체로 바꿔 가며 외우고, ◀ ▶로 오늘의 구절을 넘깁니다
          public class AmWidget extends AppWidgetProvider {
              static final String ACT_NEXT = "__PKG__.AMW_NEXT";
              static final String ACT_PREV = "__PKG__.AMW_PREV";
              static final String ACT_MODE = "__PKG__.AMW_MODE";

              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("amw", Context.MODE_PRIVATE);
              }

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) render(c, m, id);
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  super.onReceive(c, i);
                  String a = i == null ? null : i.getAction();
                  if (a == null) return;
                  SharedPreferences p = prefs(c);
                  int n = count(c);
                  if (ACT_NEXT.equals(a) && n > 0) {
                      p.edit().putInt("idx", (p.getInt("idx", 0) + 1) % n).putInt("mode", 0).apply();
                  } else if (ACT_PREV.equals(a) && n > 0) {
                      p.edit().putInt("idx", (p.getInt("idx", 0) - 1 + n) % n).putInt("mode", 0).apply();
                  } else if (ACT_MODE.equals(a)) {
                      p.edit().putInt("mode", (p.getInt("mode", 0) + 1) % 3).apply();
                  } else {
                      return;
                  }
                  updateAll(c);
              }

              static int count(Context c) {
                  try {
                      return new JSONArray(prefs(c).getString("items", "[]")).length();
                  } catch (Exception e) {
                      return 0;
                  }
              }

              static void updateAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  int[] ids = m.getAppWidgetIds(new ComponentName(c, AmWidget.class));
                  for (int id : ids) render(c, m, id);
              }

              private static PendingIntent bc(Context c, String act, int rc) {
                  Intent i = new Intent(c, AmWidget.class);
                  i.setAction(act);
                  return PendingIntent.getBroadcast(c, rc, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void render(Context c, AppWidgetManager m, int wid) {
                  SharedPreferences p = prefs(c);
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_am);
                  String id = "";
                  try {
                      JSONArray arr = new JSONArray(p.getString("items", "[]"));
                      int n = arr.length();
                      if (n == 0) {
                          v.setTextViewText(R.id.am_title, "말씀 암송");
                          v.setTextViewText(R.id.am_ref, "앱을 한 번 열어 주십시오");
                          v.setTextViewText(R.id.am_text, "외울 구절이 여기에 나타납니다.");
                          v.setTextViewText(R.id.am_mode, "보기");
                      } else {
                          int idx = Math.max(0, Math.min(n - 1, p.getInt("idx", 0)));
                          int mode = p.getInt("mode", 0);
                          JSONObject o = arr.getJSONObject(idx);
                          id = o.optString("id", "");
                          String title = p.getString("title", "오늘의 암송");
                          v.setTextViewText(R.id.am_title, title + "  " + (idx + 1) + "/" + n + (o.optInt("due", 0) == 1 ? " · 복습" : ""));
                          String topic = o.optString("t", "");
                          v.setTextViewText(R.id.am_ref, o.optString("r", "") + (topic.length() > 0 ? "  · " + topic : ""));
                          String body;
                          String btn;
                          if (mode == 0) {
                              body = "떠올려 보십시오. 위의 ‘첫 글자’를 누르면 힌트가 나옵니다.";
                              btn = "첫 글자";
                          } else if (mode == 1) {
                              body = o.optString("f", "");
                              btn = "전체 보기";
                          } else {
                              body = o.optString("x", "");
                              btn = "가리기";
                          }
                          v.setTextViewText(R.id.am_text, body);
                          v.setTextViewText(R.id.am_mode, btn);
                          v.setInt(R.id.am_text, "setTextColor", mode == 0 ? 0xFF8A8478 : 0xFF22252B);
                      }
                  } catch (Exception e) {
                      v.setTextViewText(R.id.am_text, "위젯을 그리지 못했습니다.");
                  }
                  v.setOnClickPendingIntent(R.id.am_prev, bc(c, ACT_PREV, wid * 10 + 1));
                  v.setOnClickPendingIntent(R.id.am_next, bc(c, ACT_NEXT, wid * 10 + 2));
                  v.setOnClickPendingIntent(R.id.am_mode, bc(c, ACT_MODE, wid * 10 + 3));
                  Intent open = new Intent(c, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  open.putExtra("amid", id);
                  PendingIntent po = PendingIntent.getActivity(c, wid * 10 + 4, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  v.setOnClickPendingIntent(R.id.am_body, po);
                  v.setViewVisibility(R.id.am_prev, View.VISIBLE);
                  m.updateAppWidget(wid, v);
              }
          }
          `);
          W('AmBridge.java',`package __PKG__;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;

          @CapacitorPlugin(name = "AmBridge")
          public class AmBridge extends Plugin {
              @PluginMethod
              public void set(PluginCall call) {
                  String json = call.getString("json");
                  String title = call.getString("title");
                  if (json == null) json = "[]";
                  if (title == null) title = "오늘의 암송";
                  Context c = getContext();
                  SharedPreferences p = AmWidget.prefs(c);
                  String oldId = "";
                  try {
                      JSONArray old = new JSONArray(p.getString("items", "[]"));
                      int i = p.getInt("idx", 0);
                      if (i < old.length()) oldId = old.getJSONObject(i).optString("id", "");
                  } catch (Exception e) {
                      // 처음
                  }
                  int idx = 0;
                  try {
                      JSONArray arr = new JSONArray(json);
                      for (int i = 0; i < arr.length(); i++) {
                          if (oldId.length() > 0 && oldId.equals(arr.getJSONObject(i).optString("id", ""))) {
                              idx = i;
                              break;
                          }
                      }
                  } catch (Exception e) {
                      json = "[]";
                  }
                  p.edit().putString("items", json).putString("title", title).putInt("idx", idx).apply();
                  try {
                      AmWidget.updateAll(c);
                  } catch (Exception e) {
                      // 위젯 없음
                  }
                  call.resolve();
              }

              @PluginMethod
              public void takeOpen(PluginCall call) {
                  JSObject r = new JSObject();
                  String id = "";
                  try {
                      Intent i = getActivity().getIntent();
                      if (i != null) {
                          String s = i.getStringExtra("amid");
                          if (s != null) id = s;
                          i.removeExtra("amid");
                      }
                  } catch (Exception e) {
                      // 없음
                  }
                  r.put("id", id);
                  call.resolve(r);
              }

              @Override
              protected void handleOnNewIntent(Intent intent) {
                  super.handleOnNewIntent(intent);
                  if (intent == null) return;
                  String id = intent.getStringExtra("amid");
                  if (id != null && id.length() > 0) {
                      JSObject r = new JSObject();
                      r.put("id", id);
                      notifyListeners("open", r, true);
                      intent.removeExtra("amid");
                  }
              }
          }
          `);
          fs.writeFileSync(path.join(res,'layout/widget_am.xml'),`<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/am_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="10dp"
              android:background="@drawable/am_widget_bg">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="36dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">
                  <TextView
                      android:id="@+id/am_title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:maxLines="1"
                      android:ellipsize="end"
                      android:textColor="#C8963E"
                      android:textSize="13sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/am_prev"
                      android:layout_width="38dp"
                      android:layout_height="match_parent"
                      android:gravity="center"
                      android:text="◀"
                      android:textColor="#27407A"
                      android:textSize="16sp" />
                  <TextView
                      android:id="@+id/am_mode"
                      android:layout_width="wrap_content"
                      android:layout_height="30dp"
                      android:minWidth="70dp"
                      android:gravity="center"
                      android:paddingLeft="10dp"
                      android:paddingRight="10dp"
                      android:background="@drawable/am_btn_bg"
                      android:textColor="#FFFFFFFF"
                      android:textSize="13sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/am_next"
                      android:layout_width="38dp"
                      android:layout_height="match_parent"
                      android:gravity="center"
                      android:text="▶"
                      android:textColor="#27407A"
                      android:textSize="16sp" />
              </LinearLayout>
              <LinearLayout
                  android:id="@+id/am_body"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:orientation="vertical">
                  <TextView
                      android:id="@+id/am_ref"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:maxLines="1"
                      android:ellipsize="end"
                      android:textColor="#27407A"
                      android:textSize="18sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/am_text"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:layout_marginTop="4dp"
                      android:ellipsize="end"
                      android:fontFamily="serif"
                      android:lineSpacingExtra="4dp"
                      android:textColor="#22252B"
                      android:textSize="16sp" />
              </LinearLayout>
          </LinearLayout>
          `);
          fs.writeFileSync(path.join(res,'drawable/am_widget_bg.xml'),`<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#F7FFFDF8" /><corners android:radius="20dp" /><stroke android:width="1dp" android:color="#E2DACB" /></shape>
          `);
          fs.writeFileSync(path.join(res,'drawable/am_btn_bg.xml'),`<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#FF27407A" /><corners android:radius="15dp" /></shape>
          `);
          fs.writeFileSync(path.join(res,'xml/widget_am_info.xml'),`<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="90dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_am"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          `);
          const ma=path.join(javaDir,'MainActivity.java');let m=fs.readFileSync(ma,'utf8');
          if(!m.includes('AmBridge')){
            if(/public class MainActivity extends BridgeActivity \{\s*\}/.test(m)){m=m.replace(/public class MainActivity extends BridgeActivity \{\s*\}/,`public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(AmBridge.class);
                  super.onCreate(savedInstanceState);
              }
          }`)}else if(m.includes('super.onCreate(savedInstanceState);')){m=m.replace('super.onCreate(savedInstanceState);','registerPlugin(AmBridge.class);\n        super.onCreate(savedInstanceState);')}
            fs.writeFileSync(ma,m)}
          if(!m.includes('registerPlugin(AmBridge.class)')){console.error('MainActivity에 AmBridge를 등록하지 못했습니다:\n'+m);process.exit(1)}
          const mp='android/app/src/main/AndroidManifest.xml';let x=fs.readFileSync(mp,'utf8');
          if(!x.includes('.AmWidget')){x=x.replace('</application>',`        <receiver android:name=".AmWidget" android:exported="false" android:label="말씀 암송">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_am_info" />
                  </receiver>
              </application>`)}
          fs.writeFileSync(mp,x);console.log('암송 위젯 추가 완료:',pkg);
          AWJ
          node add-amw.js
      - name: 서명 키 고정 (업데이트가 기존 앱 위에 설치되도록)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          VC=$(( $(date +%s) / 60 - 29000000 )); sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/" android/app/build.gradle; echo "versionCode=${VC} (시간 기준이라 항상 이전보다 큼 → 지우지 않고 덮어 설치)"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle || true
      - name: APK 빌드
        run: |
          set -o pipefail
          chmod +x android/gradlew
          if (cd android && ./gradlew assembleDebug --console=plain) 2>&1 | tee build.log; then exit 0; fi
          cp build.log build-fail-1.log
          if grep -qi "text-to-speech\|texttospeech" build.log; then
            echo "::warning::읽어 주기(TTS) 부품 때문에 빌드가 실패해 빼고 다시 빌드합니다"
            npm uninstall @capacitor-community/text-to-speech && npx cap sync android
            (cd android && ./gradlew assembleDebug --console=plain) 2>&1 | tee build.log && exit 0
          fi
          { echo "## 빌드 오류 요약"; echo '```'; grep -E "error:|What went wrong|Execution failed|cannot find" -A3 build.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          echo "::error::빌드 실패"; exit 1
      - name: 빌드 실패 로그 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-fail-*.log
          if-no-files-found: ignore
      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: malsseum-amsong-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
